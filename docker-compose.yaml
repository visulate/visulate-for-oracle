version: "3.3"
services:
  reverseproxy:
    build: ./proxy-config
    ports:
      - 80:80
  visapi:
    hostname: visapi
    depends_on:
      - reverseproxy
    build: ./api-server
    ports:
      - "3000:3000"
    volumes:
      - ./api-server/config:/visulate-server/config
      - visulate-downloads:/visulate-server/downloads
      - ./repos:/app/repos
      - ./wallet:/opt/oracle/network/admin:ro
    environment:
      - GOOGLE_AI_KEY=${GOOGLE_AI_KEY}
      - CORS_ORIGIN_WHITELIST=${CORS_ORIGIN_WHITELIST}
      - GIT_REPOS_DIR=/app/repos
      - GIT_MODE=local
      - ENABLE_GIT_INTEGRATION=true
      - VISULATE_AGENT_URL=http://ai-agent:10000/agent/generate
      - COMMENT_GENERATOR_URL=http://ai-agent:10003/agent/generate
      - INVALID_OBJECTS_URL=http://ai-agent:10006/agent/generate
      - APP_DEVELOPER_URL=http://ai-agent:10007/agent/generate
      - TEST_DATA_GENERATOR_URL=http://ai-agent:10008/agent/generate
      - SCHEMA_COMPARISON_URL=http://ai-agent:10009/agent/generate
      - README_GENERATOR_URL=http://ai-agent:10010/agent/generate
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
  visui:
    hostname: visui
    depends_on:
      - reverseproxy
    build: ./ui
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
  vissql:
    hostname: vissql
    depends_on:
      - reverseproxy
    build: ./query-engine
    expose:
      - "5000"
    volumes:
      - ./query-engine/sql2csv/config:/query-engine/sql2csv/config
      - ./wallet:/opt/oracle/network/admin:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
  ai-agent:
    hostname: ai-agent
    build: ./ai-agent
    depends_on:
      - reverseproxy
      - vissql
      - visapi
    ports:
      - "10000-10010:10000-10010"
    volumes:
      - visulate-downloads:/app/downloads
      - ./repos:/app/repos
      - ./wallet:/opt/oracle/network/admin:ro
    environment:
      - GOOGLE_AI_KEY=${GOOGLE_AI_KEY}
      - GOOGLE_API_KEY=${GOOGLE_AI_KEY}
      - GIT_REPOS_DIR=/app/repos
      - VISULATE_BASE=http://reverseproxy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import requests; requests.get('http://localhost:10000/openapi.json').raise_for_status()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  visulate-downloads: